name: Catalogue upstream connectivity test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test catalogue endpoint without publishing or retrying
        env:
          CATALOGUE_URL: https://api.ppv.st/api/streams
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = os.environ["CATALOGUE_URL"]
          req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "Ninety-Catalogue-Connectivity-Test/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=12) as response:
                  print("HTTP status:", response.status)
                  print("Content type:", response.headers.get("Content-Type"))
                  payload = json.load(response)
              if not isinstance(payload, dict) or not isinstance(payload.get("streams"), list):
                  print("Response did not contain the expected streams array.")
                  if isinstance(payload, dict):
                      print("Response keys:", list(payload)[:10])
                      print("Upstream error:", str(payload.get("error", ""))[:160])
                  raise SystemExit(1)
              print("Catalogue group count:", len(payload["streams"]))
              print("Connectivity test passed; no data was published.")
          except urllib.error.HTTPError as exc:
              print("Upstream HTTP status:", exc.code)
              raise SystemExit(1)
          except (urllib.error.URLError, TimeoutError, ValueError) as exc:
              print("Connectivity test failed:", type(exc).__name__, str(exc)[:160])
              raise SystemExit(1)
          PY
