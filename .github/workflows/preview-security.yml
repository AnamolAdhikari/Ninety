name: Preview Security Tests

on:
  workflow_dispatch:
  push:
    branches:
      - feat/telemetry-control-center-auto

permissions:
  contents: read

concurrency:
  group: preview-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    if: github.ref == 'refs/heads/feat/telemetry-control-center-auto'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NINETY_E2E_BASE_URL: https://feat-telemetry-control-center-auto-live.n90.workers.dev
      NINETY_E2E_FRIEND_USERNAME: ${{ secrets.NINETY_E2E_FRIEND_USERNAME }}
      NINETY_E2E_FRIEND_PASSWORD: ${{ secrets.NINETY_E2E_FRIEND_PASSWORD }}

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for hardened feature Preview
        shell: bash
        run: |
          for attempt in {1..36}; do
            headers="$(curl -sS -D - -o /dev/null "$NINETY_E2E_BASE_URL/login" || true)"
            status="$(printf '%s' "$headers" | grep -Eio '^HTTP/[^ ]+ [0-9]+' | tail -1 | awk '{print $2}')"
            hsts="$(printf '%s' "$headers" | tr -d '\r' | grep -Ei '^strict-transport-security:' | head -1 || true)"
            if [ "$status" = "200" ] && [ -n "$hsts" ]; then
              echo "Latest hardened Preview is ready."
              exit 0
            fi
            echo "Preview not ready with expected security headers yet (HTTP $status); attempt $attempt/36."
            sleep 10
          done
          echo "Feature Preview did not become ready with the expected hardened runtime in time."
          exit 1

      - name: Run security E2E suite
        run: pnpm test:e2e:security

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-security-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
