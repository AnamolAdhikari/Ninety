    <text x="150" y="198" fill="#baff32" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">UPCOMING</text>
    <text x="105" y="246" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Countdown</text>
    <text x="105" y="274" fill="#8f9d97" font-family="Inter,Arial,sans-serif" font-size="15">Warm-up state and source checks</text>
  </g>

  <path d="M350 230H435" stroke="#baff32" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="455" y="155" width="260" height="150" rx="22" fill="#101820" stroke="#3b5020"/>
    <circle cx="500" cy="202" r="20" fill="#192811" stroke="#baff32"/>
    <circle cx="500" cy="202" r="6" fill="#baff32"/>
    <path d="M512 190c10 7 10 17 0 24M518 184c18 13 18 31 0 44" stroke="#baff32" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="535" y="198" fill="#baff32" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">LIVE</text>
    <text x="490" y="246" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Matchday</text>
    <text x="490" y="274" fill="#8f9d97" font-family="Inter,Arial,sans-serif" font-size="15">Playback, events and lineups</text>
  </g>

  <path d="M735 230H820" stroke="#baff32" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="840" y="155" width="260" height="150" rx="22" fill="#101820" stroke="#27333d"/>
    <circle cx="885" cy="202" r="20" fill="#18251c" stroke="#baff32"/>
    <path d="M875 201l7 7 14-17" stroke="#baff32" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="920" y="198" fill="#baff32" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">FULL TIME</text>
    <text x="875" y="246" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Result</text>
    <text x="875" y="274" fill="#8f9d97" font-family="Inter,Arial,sans-serif" font-size="15">Verified score and final timeline</text>
  </g>

  <path d="M1120 230H1205" stroke="#baff32" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1225" y="155" width="110" height="150" rx="22" fill="#101820" stroke="#27333d"/>
