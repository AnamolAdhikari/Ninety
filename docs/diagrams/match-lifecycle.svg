<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#090d12"/><stop offset="1" stop-color="#0d1512"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#baff32"/></marker>
  </defs>
  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Match lifecycle</text>
  <text x="70" y="104" fill="#81908a" font-family="Inter,Arial,sans-serif" font-size="16">The interface changes with the real state of the fixture and degrades safely when data is unavailable.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="155" width="260" height="150" rx="22" fill="#101820" stroke="#27333d"/>
    <circle cx="115" cy="202" r="20" fill="#18251c" stroke="#baff32"/>
