  </g>

  <rect x="455" y="332" width="645" height="46" rx="23" fill="#0c1318" stroke="#26323b"/>
  <text x="777" y="360" text-anchor="middle" fill="#7f8f88" font-family="Inter,Arial,sans-serif" font-size="14">Unavailable data or playback becomes a recoverable UI state, not a broken page.</text>
